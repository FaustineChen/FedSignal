<!DOCTYPE html>
<html>

<head>
    <title>Fed Signal</title>
    <link rel="stylesheet" href="/static/style.css"/>
</head>

<body>
    <h1>FedSignal</h1>

    <section>
        <h2>Upload Document</h2>

        <form id = "upload-form">
            <div class="form-field">
                <label for="document-upload">
                    File <span>*</span>
                </label>

                <input
                    type="file"
                    id="document-upload"
                    name="file"
                    accept=".pdf"
                    required
                >
            </div>
        

            <div class="form-field">
                <label for="upload-title">
                    Title <span>*</span>
                </label>
                <input
                    type="text"
                    id="upload-title"
                    name="title"
                    required
                >
            </div>

            <div class="form-field">
                <label for="upload-document-type">
                    Document Type <span>*</span>
                </label>

                <select
                    id="upload-document-type"
                    name="document_type"
                    required
                >
                    <option value="" disabled selected>
                        -- Please select an option --
                    </option>

                    <option value="fomc_statement">
                        FOMC Statement
                    </option>

                    <option value="fomc_minutes">
                        FOMC Minutes
                    </option>

                    <option value="press_conference">
                        Press Conference
                    </option>
                </select>
            </div>

            <div class="form-field">
                <label for="upload-published-date">
                    Published Date <span>*</span>
                </label>

                <input
                    type="date"
                    id="upload-published-date"
                    name="published_date"
                    required
                >
            </div>

            <div class="form-field">
                <label for="upload-start-date">
                    Event Start Date
                </label>

                <input
                    type="date"
                    id="upload-start-date"
                    name="event_start_date"
                >
            </div>

            <div class="form-field">
                <label for="upload-end-date">
                    Event End Date
                </label>

                <input
                    type="date"
                    id="upload-end-date"
                    name="event_end_date"
                >
            </div>

            <div class="form-field">
                <label for="upload-source">
                    Source <span>*</span>
                </label>

                <input
                    type="text"
                    id="upload-source"
                    name="source"
                    required
                >
            </div>

            <div class="form-field">
                <label for="upload-speaker">
                    Speaker
                </label>

                <input
                    type="text"
                    id="upload-speaker"
                    name="speaker"
                >
            </div>

            <div class="form-field">
                <label for="upload-speaker-position">
                    Speaker Position
                </label>

                <input
                    type="text"
                    id="upload-speaker-position"
                    name="speaker_position"
                >
            </div>

            <div class="form-field">
                <label for="upload-chiar">
                    Chair
                </label>

                <input
                    type="text"
                    id="upload-chair"
                    name="chair"
                >
            </div>

            <div class="form-field">
                <label for="upload-source-url">
                    Source URL <span>*</span>
                </label>

                <input
                    type="url"
                    id="upload-source-url"
                    name="source_url"
                    required
                >
            </div>

        <button type="submit" >
            Upload Document
        </button>
        
        </form>

        <div id="upload-result"></div>
    </section>

    <section>
        <h2>Search Documents</h2>

        <div class="form-field">
            <label>Keyword</label>
            <input type="text" id="keyword">
        </div>

        <div class="form-field">
            <label>Category</label>
            <input type="text" id="category">
        </div>

        <div class="form-field">
            <label>Document Type</label>
            <select id="document-type">
                <option value="">All</option>
                <option value="fomc_statement">FOMC Statement</option>
                <option value="fomc_minutes">FOMC Minutes</option>
                <option value="press_conference">Press Conference</option>
            </select>
        </div>

        <div class="form-field">
            <label>Document ID</label>
            <input type="number" id="document-id">
        </div>

        <div class="form-field">
            <label>Start Date</label>
            <input type="date" id="start-date">
        </div>

        <div class="form-field">
            <label>End Date</label>
            <input type="date" id="end-date">
        </div>

        <div class="form-field">
            <label>Date Field</label>
            <select id="date-field">
                <option value="published">published</option>
                <option value="event">event</option>
            </select>
        </div>

        <div class="form-field">
            <label>Limit</label>
            <!-- <input type="number" id="limit" min="1" value="20"> -->
            <select id="limit">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>

            <span class="hint">Display only</span>
        </div>

        <div class="action-row">
            <button id="search-matches">Search Matches</button>

            <div class="export-action">
                <button id="export-search-matches">Export CSV</button>
                <span class="hint">Downloads all matching results</span>
            </div>
        </div>

        <div class="summary-area">
            <h3>Summary</h3>
            <div class="form-field">
                <label>Summary By</label>
                <select id="summary-by">
                    <option value="document">Document</option>
                    <option value="date">Date</option>
                    <option value="document_type">Document Type</option>
                    <option value="keyword">Keyword</option>
                </select>                
            </div>

            <div class="action-row">
                <button id="view-summary">View Summary</button>

                <div class="export-action">
                    <button id="export-view-summary">Export CSV</button>
                    <span class="hint">Downloads all matching results</span>
                </div>
            </div>
        </div>

        

    </section>

    <section>
        <h2>Results</h2>
        <div id="results"></div>
    </section>

    <script src="/static/app.js"></script>

</body>

</html>
